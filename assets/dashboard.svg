  .cyan { fill: #5dc9f2; }
  .red { fill: #e8384f; }
  .label { font-size: 12px; letter-spacing: 1px; }
  .heading { font-size: 17px; font-weight: 700; }
  .body { font-size: 14px; }
  .small { font-size: 12px; }
  .panel { fill: #0e172b; stroke: #2a3558; stroke-width: 1; }
  .cursor { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
