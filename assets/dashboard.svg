<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Animated developer dashboard</title><desc id="desc">Animated technology stack, selected projects, and contact links for zaxxinfinity.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#91a0ba}.heading{fill:#e8edf8;font-size:19px;font-weight:700}.label{fill:#8fa0bb;font-size:12px;letter-spacing:1.5px}.name{fill:#e8edf8;font-size:16px;font-weight:600}.small{fill:#aebbd0;font-size:13px}.panel{fill:#101a2b;stroke:#263653}.tile{fill:#142238;stroke:#29415f}.glow{animation:glow 2.8s ease-in-out infinite alternate}.float1{animation:float 4s ease-in-out infinite}.float2{animation:float 4s ease-in-out -1.3s infinite}.float3{animation:float 4s ease-in-out -2.6s infinite}.pulse{animation:pulse 2s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.dash{stroke-dasharray:7 9;animation:dash 12s linear infinite}.blink{animation:blink 1s steps(2,start) infinite}@keyframes glow{from{opacity:.55}to{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(260px)}}@keyframes dash{to{stroke-dashoffset:-160}}@keyframes blink{to{opacity:0}}
</style>
<defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#5dc9f2"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="958" height="648" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="960" height="650" rx="16" fill="#0b1120" stroke="#263653"/><path d="M0 1H960" stroke="url(#line)" stroke-width="3"/><text x="28" y="43" class="label">01 / TOOLKIT</text><text x="28" y="76" class="heading">Languages &amp; Technologies</text><text x="930" y="43" text-anchor="end" class="muted" font-size="12">zaxxinfinity@github:~$ <tspan class="blink" fill="#5dc9f2">_</tspan></text>
<!-- programming -->
<rect x="28" y="100" width="438" height="135" rx="12" class="panel"/><text x="50" y="130" class="label">PROGRAMMING LANGUAGES</text>
<g class="float1"><rect x="50" y="149" width="174" height="62" rx="9" class="tile"/><text x="68" y="188" fill="#5dc9f2" font-size="28" font-weight="700">TS</text><text x="116" y="185" class="name">TypeScript</text></g>
<g class="float2"><rect x="238" y="149" width="202" height="62" rx="9" class="tile"/><text x="254" y="188" fill="#f7df5e" font-size="28" font-weight="700">JS</text><text x="302" y="185" class="name">JavaScript</text></g>
<!-- runtime -->
<rect x="494" y="100" width="438" height="135" rx="12" class="panel"/><text x="516" y="130" class="label">RUNTIME / BACKEND / AUTOMATION</text>
<g class="float3"><rect x="516" y="149" width="190" height="62" rx="9" class="tile"/><text x="532" y="186" fill="#79c95b" font-size="24" font-weight="700">JS</text><text x="578" y="185" class="name">Node.js</text></g>
<g class="float1"><rect x="720" y="149" width="190" height="62" rx="9" class="tile"/><text x="736" y="186" fill="#6ba6d9" font-size="22" font-weight="700">PG</text><text x="782" y="185" class="name">PostgreSQL</text></g>
<!-- markup and tools -->
<rect x="28" y="253" width="438" height="125" rx="12" class="panel"/><text x="50" y="283" class="label">MARKUP &amp; STYLING</text><g class="float2"><rect x="50" y="301" width="174" height="56" rx="9" class="tile"/><text x="67" y="338" fill="#ef7848" font-size="22" font-weight="700">HTML5</text></g><g class="float3"><rect x="238" y="301" width="202" height="56" rx="9" class="tile"/><text x="255" y="338" fill="#4e9edb" font-size="22" font-weight="700">CSS3</text></g>
<rect x="494" y="253" width="438" height="125" rx="12" class="panel"/><text x="516" y="283" class="label">TOOLS &amp; DEPLOYMENT</text><text x="516" y="326" class="name">Git  ·  GitHub  ·  Linux  ·  PM2  ·  Vercel</text><path d="M516 348H908" stroke="#29415f" class="dash"/>
<!-- selected work -->
<text x="28" y="425" class="label">02 / SELECTED WORK</text><rect x="28" y="447" width="438" height="105" rx="12" class="panel"/><g class="glow"><circle cx="58" cy="480" r="7" fill="#5dc9f2"/><text x="80" y="486" class="name">tourl</text></g><text x="50" y="516" class="small">File upload utility that turns files into shareable links.</text><text x="50" y="538" fill="#5dc9f2" font-size="12">github.com/zaxxinfinity/tourl</text>
<rect x="494" y="447" width="438" height="105" rx="12" class="panel"/><g class="pulse"><circle cx="524" cy="480" r="7" fill="#a78bfa"/><text x="546" y="486" class="name">Portfolio</text></g><text x="516" y="516" class="small">Personal website for development and design work.</text><text x="516" y="538" fill="#5dc9f2" font-size="12">zynnshima.web.id</text>
<!-- contact footer -->
<path d="M28 582H932" stroke="#263653"/><text x="28" y="612" class="label">03 / CONTACT</text><g class="glow"><rect x="180" y="590" width="180" height="40" rx="20" fill="#142238" stroke="#31506e"/><text x="270" y="615" text-anchor="middle" class="name" font-size="13">GitHub ↗</text></g><g class="float2"><rect x="390" y="590" width="180" height="40" rx="20" fill="#142238" stroke="#31506e"/><text x="480" y="615" text-anchor="middle" class="name" font-size="13">Portfolio ↗</text></g><g class="float3"><rect x="600" y="590" width="180" height="40" rx="20" fill="#142238" stroke="#31506e"/><text x="690" y="615" text-anchor="middle" class="name" font-size="13">Web Developer</text></g>
<rect x="28" y="640" width="904" height="2" fill="#17243a"/><rect x="28" y="640" width="220" height="2" fill="url(#line)" class="scan"/></g></svg>